name: Android Signed Release APK

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-signed-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/wifisense-release.keystore
            echo "Keystore decoded from secrets"
          else
            echo "No keystore secret found — using repo keystore"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Download Gradle Wrapper JAR
        run: |
          curl -L https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: wifisense-release.keystore
          KEYSTORE_PASSWORD: WifiSense2024
          KEY_ALIAS: wifisense-key
          KEY_PASSWORD: WifiSense2024
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK with Version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          DATE=$(date +%Y%m%d)
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/WifiSense-v${VERSION}-${DATE}-signed.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiSense-Signed-Release-APK
          path: android/app/build/outputs/apk/release/WifiSense-*.apk
          retention-days: 90

      - name: Upload APK (original name)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "**Signed Release APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Build failed** — check logs above." >> $GITHUB_STEP_SUMMARY
          fi
